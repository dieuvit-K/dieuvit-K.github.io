<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification Certificat — JSB 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f0eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      text-align: center;
    }
    .seal {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 40px;
    }
    .valid .seal { background: #e8f5e9; }
    .invalid .seal { background: #ffebee; }
    .loading .seal { background: #f5f5f5; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 8px; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
    .info { text-align: left; margin: 20px 0; }
    .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .info-row:last-child { border: none; }
    .label { color: #888; font-size: 13px; }
    .value { font-weight: 600; color: #1a1a2e; font-size: 14px; }
    .status-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      margin: 16px 0;
    }
    .valid .status-badge { background: #e8f5e9; color: #2e7d32; }
    .invalid .status-badge { background: #ffebee; color: #c62828; }
    .badge-cert { 
      display: inline-block;
      padding: 4px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-participant { background: #e3f2fd; color: #1565c0; }
    .badge-challenger { background: #fff3e0; color: #e65100; }
    .badge-organisation { background: #e8f5e9; color: #2e7d32; }
    .footer { margin-top: 24px; font-size: 12px; color: #aaa; }
    .error { color: #c62828; }
    a { color: #1565c0; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card loading" id="card">
    <div class="seal">🔍</div>
    <h1>Vérification du certificat</h1>
    <p class="subtitle">Vérification en cours...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const certId = params.get('id');

    async function verify() {
      const card = document.getElementById('card');
      
      if (!certId) {
        card.className = 'card invalid';
        card.innerHTML = `
          <div class="seal">❓</div>
          <h1>Aucun ID fourni</h1>
          <p class="subtitle">Scannez le QR code complet sur votre certificat.</p>
          <p class="subtitle">L'URL doit contenir <code>?id=XXXXX</code></p>
          <div class="footer">
            2ᵉ Édition — Journée des Sciences Biologiques 2026
          </div>
        `;
        return;
      }

      try {
        const resp = await fetch('certificats_data.json');
        const data = await resp.json();
        const cert = data.certificats[certId];

        if (!cert || !cert.valide) {
          card.className = 'card invalid';
          card.innerHTML = `
            <div class="seal">❌</div>
            <h1>Certificat non trouvé</h1>
            <p class="subtitle">Ce certificat semble invalide ou inconnu.</p>
            <div class="status-badge">⚠️ NON AUTHENTIQUE</div>
            <p class="error">ID: ${certId}</p>
            <div class="footer">
              Contactez le Comité d'Organisation si vous pensez qu'il s'agit d'une erreur.
            </div>
          `;
          return;
        }

        const badgeClass = {
          'participant': 'badge-participant',
          'challenger': 'badge-challenger',
          'organisation': 'badge-organisation'
        }[cert.type] || '';

        const typeLabels = {
          'participant': 'Participant',
          'challenger': 'Challenger',
          'organisation': 'Organisation'
        };

        card.className = 'card valid';
        card.innerHTML = `
          <div class="seal">✅</div>
          <h1>Certificat Authentique</h1>
          <p class="subtitle">Ce certificat est valide et enregistré officiellement.</p>
          <div class="status-badge">✅ CERTIFICAT VALIDE</div>
          <div class="badge-cert ${badgeClass}">${typeLabels[cert.type] || cert.type}</div>
          <div class="info">
            <div class="info-row">
              <span class="label">Bénéficiaire</span>
              <span class="value">${cert.nom}</span>
            </div>
            <div class="info-row">
              <span class="label">Événement</span>
              <span class="value">${cert.evenement}</span>
            </div>
            <div class="info-row">
              <span class="label">Date</span>
              <span class="value">${cert.date}</span>
            </div>
            <div class="info-row">
              <span class="label">Lieu</span>
              <span class="value">${cert.lieu}</span>
            </div>
            <div class="info-row">
              <span class="label">ID Certificat</span>
              <span class="value" style="font-family:monospace;font-size:12px;">${certId}</span>
            </div>
          </div>
          <p class="subtitle">
            Organisé par <strong>Pr Aimé Christian KAYATH</strong><br>
            <span style="font-size:12px;">Université Marien NGOUABI — Faculté des Sciences et Techniques</span>
          </p>
          <div class="footer">
            2ᵉ Édition — Journée des Sciences Biologiques 2026
          </div>
        `;
      } catch(e) {
        card.className = 'card invalid';
        card.innerHTML = `
          <div class="seal">⚠️</div>
          <h1>Erreur de vérification</h1>
          <p class="subtitle">Impossible de charger les données de vérification.</p>
          <p class="error">${e.message}</p>
          <div class="footer">
            Réessayez plus tard ou contactez le Comité d'Organisation.
          </div>
        `;
      }
    }
    verify();
  </script>
</body>
</html>
